
      - name: Name APKs for ZedTunnel
        run: |
          set -e
          mkdir -p dist
          V='${{ steps.v.outputs.name }}'
          for abi in arm64-v8a armeabi-v7a x86_64; do
            src="app/build/outputs/apk/release/app-$abi-release.apk"
            [ -f "$src" ] || { echo "::error::$src was not built"; exit 1; }
            cp "$src" "dist/ZedTunnel-$V-$abi.apk"
          done
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          python3 tools/universal-apk.py "dist/ZedTunnel-$V-arm64-v8a.apk" /tmp/universal.apk "dist/ZedTunnel-$V-armeabi-v7a.apk"
          "$BT/zipalign" -f -P 16 4 /tmp/universal.apk /tmp/universal-aligned.apk
          STORE_PW=$(grep '^storePassword=' keystore.properties | cut -d= -f2-) \
          KEY_PW=$(grep '^keyPassword=' keystore.properties | cut -d= -f2-) \
          "$BT/apksigner" sign --ks release.keystore \
            --ks-key-alias "$(grep '^keyAlias=' keystore.properties | cut -d= -f2-)" \
            --ks-pass env:STORE_PW --key-pass env:KEY_PW \
            --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled false --v4-signing-enabled false \
            --out "dist/ZedTunnel-$V-universal.apk" /tmp/universal-aligned.apk
          rm -f /tmp/universal.apk /tmp/universal-aligned.apk
          for apk in dist/ZedTunnel-*.apk; do
            "$BT/apksigner" verify "$apk"
            a=$("$BT/apksigner" verify --print-certs "$apk" | grep -m1 'SHA-256' | awk '{print $NF}')
            b=$("$BT/apksigner" verify --print-certs "dist/ZedTunnel-$V-arm64-v8a.apk" | grep -m1 'SHA-256' | awk '{print $NF}')
            [ "$a" = "$b" ] || { echo "::error::$apk is signed with a different key"; exit 1; }
          done
          "$BT/aapt2" dump badging "dist/ZedTunnel-$V-universal.apk" | grep -q "native-code: 'arm64-v8a' 'armeabi-v7a'" \
            || { echo "::error::the universal APK does not carry both ARM ABIs"; exit 1; }
          ( cd dist && sha256sum ZedTunnel-*.apk > SHA256SUMS-android.txt )
          ls -l dist
