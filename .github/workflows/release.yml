
name: zedtunnel-release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      name: ${{ steps.v.outputs.name }}

    steps:
      - uses: actions/checkout@v7

      - name: Verify the ZedTunnel release tag
        id: v
        run: |
          set -e
          v=$(grep '^zedsecure.versionName=' gradle.properties | cut -d= -f2)

          [ "v$v" = "$GITHUB_REF_NAME" ] || {
            echo "::error::Tag $GITHUB_REF_NAME does not match zedsecure.versionName=$v"
            exit 1
          }

          echo "name=$v" >> "$GITHUB_OUTPUT"

  android:
    needs: version
    uses: ./.github/workflows/android-release.yml
    secrets: inherit

  desktop:
    needs: version
    uses: ./.github/workflows/desktop-release.yml
    secrets: inherit

  publish:
    needs: [version, android, desktop]
    runs-on: ubuntu-24.04

    steps:
      - name: Download Android APKs
        uses: actions/download-artifact@v8
        with:
          name: android-apks
          path: dist

      - name: Download all ZedTunnel desktop builds
        uses: actions/download-artifact@v8
        with:
          pattern: "zedtunnel-desktop-*"
          path: dist
          merge-multiple: true

      - name: Verify all release files
        run: |
          set -e

          V='${{ needs.version.outputs.name }}'

          echo "===== RELEASE FILES ====="
          ls -lh dist

          required_files=(
            "ZedTunnel-$V-arm64-v8a.apk"
            "ZedTunnel-$V-universal.apk"
            "ZedTunnel-$V-armeabi-v7a.apk"
            "ZedTunnel-$V-x86_64.apk"
            "ZedTunnel-$V-amd64.deb"
            "ZedTunnel-$V-x86_64.rpm"
            "ZedTunnel-$V-linux-x86_64.tar.gz"
            "ZedTunnel-$V-x86_64.AppImage"
            "ZedTunnel-$V-x86_64.msi"
            "ZedTunnel-$V-windows-x86_64.zip"
            "ZedTunnel-$V-macos-arm64.dmg"
            "ZedTunnel-$V-macos-x86_64.dmg"
          )

          for f in "${required_files[@]}"; do
            [ -f "dist/$f" ] || {
              echo "::error::Required release file is missing: $f"
              exit 1
            }
            echo "OK: $f"
          done

          echo "All required ZedTunnel release files are present."

      - name: Publish ZedTunnel draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          V='${{ needs.version.outputs.name }}'

          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "ZedTunnel $V" \
            --notes "ZedTunnel $V release." \
            --draft
